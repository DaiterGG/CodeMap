[package]
name = "hello-cli"
version = "0.1.0"
edition = "2024"
autoexamples = false

[dependencies]
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
base64 = "0.22"
dotenvy = "0.15"
serde_json = "1"
wasm-bindgen-cli-support = "0.2.130"

[[example]]
name = "small_repo"
path = "examples/small_repo/main.rs"

[[example]]
name = "tiny_repo_unused_module"
path = "examples/tiny repo unused module/main.rs"

[workspace]
members = ["browser-core"]
default-members = ["."]
resolver = "3"
