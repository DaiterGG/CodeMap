[package]
name = "hello-cli"
version = "0.1.0"
edition = "2024"
autoexamples = false

[dependencies]
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
url = "2"

[build-dependencies]
wasm-bindgen-cli-support = "0.2.130"

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.15", default-features = false }

[[example]]
name = "small_repo"
path = "examples/small_repo/main.rs"

[[example]]
name = "tiny_repo_unused_module"
path = "examples/tiny repo unused module/main.rs"

[workspace]
members = ["browser-core"]
default-members = ["."]
resolver = "3"
