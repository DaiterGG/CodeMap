<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Mermaid Graph</title>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({ startOnLoad: true, layout: 'elk', theme: 'default' });
  </script>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 2rem; }
    .mermaid { max-width: 900px; margin: 2rem auto; }
  </style>
</head>
<body>
  <h1>Simple graph</h1>

  <pre class="mermaid">
flowchart LR
    User --> API

    subgraph Backend["Backend services"]
      direction TB
      API --> Auth
      Auth --> Database
    end
  </pre>
</body>
</html>
