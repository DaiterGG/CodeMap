<!doctype html>
<html lang="en" data-pattern="crosses">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeMap</title>
  <style>{{CSS}}</style>
</head>

<body>
  <main>
    <div class="page-header">
      <div class="page-identity">
        <div class="brand-name">CodeMap</div>
        <div class="graph-details" id="graph-details">{{GRAPH_DETAILS}}</div>
      </div>
      <div class="page-controls">
        <div class="model-settings-row">
          <div class="model-controls">
            <div class="model-picker" id="model-picker">
              <button class="control-button" id="model-select" type="button" disabled aria-haspopup="listbox"
                aria-expanded="false" aria-controls="model-options">Loading models...</button>
              <div class="model-menu" id="model-menu" hidden>
                <input class="control-button model-search" id="model-search" type="search"
                  placeholder="Search models..." autocomplete="off" aria-label="Search models">
                <div class="model-options" id="model-options" role="listbox" aria-label="Models"></div>
              </div>
            </div>
          </div>
          <button class="control-button generation-settings-button" id="generation-settings-button" type="button"
            aria-label="Generation Settings" title="Generation Settings" aria-haspopup="dialog"
            aria-controls="generation-settings-dialog">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd"
                d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.28 7.28 0 0 0-1.63-.94l-.36-2.54A.49.49 0 0 0 13.87 2h-3.74a.49.49 0 0 0-.49.42L9.28 4.96c-.59.23-1.13.54-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.73 8.48a.5.5 0 0 0 .12.64L4.88 10.7c-.04.3-.06.61-.06.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.4 1.04.71 1.63.94l.36 2.54c.04.24.25.42.49.42h3.74c.24 0 .45-.18.49-.42l.36-2.54c.59-.23 1.13-.54 1.63-.94l2.39.96c.23.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z">
              </path>
            </svg>
          </button>
        </div>
        <button class="control-button" id="export-button" type="button" aria-haspopup="dialog"
          aria-controls="export-dialog">Import / Export Graph</button>
        <div class="generation-actions-row">
          <button class="control-button" id="upload-code-button" type="button">Upload code</button>
          <button class="control-button" id="generate-button" type="button">Generate</button>
        </div>
      </div>
    </div>
    <div class="resize-handle" id="sidebar-resize-handle" role="separator" aria-orientation="vertical"
      aria-label="Resize sidebar" aria-valuemin="220" aria-valuenow="280" tabindex="0"></div>
    <div class="canvas"><svg id="graph-svg" role="img" aria-label="Codebase graph"></svg></div>
  </main>
  <dialog class="upload-dialog" id="upload-dialog" aria-labelledby="upload-dialog-title">
    <div class="upload-panel">
      <div class="upload-heading">
        <h2 id="upload-dialog-title">Upload code</h2>
        <button class="control-button" id="upload-close-button" type="button"
          aria-label="Close upload window">Close</button>
      </div>
      <label class="upload-field" for="github-repository-url">
        Public GitHub repository URL
        <input id="github-repository-url" type="url" placeholder="https://github.com/owner/repository"
          autocomplete="url">
      </label>
      <label class="upload-field" for="upload-files">
        Select a local folder
        <input id="upload-files" type="file" webkitdirectory directory multiple hidden>
      </label>
      <div class="upload-dropzone" id="upload-dropzone" tabindex="0">
        Drop files or folders here
      </div>
      <button class="control-button" id="upload-browse-button" type="button">Choose folder</button>
      <span id="upload-picker-status" aria-live="polite"></span>
    </div>
  </dialog>
  <dialog class="upload-dialog" id="generation-settings-dialog" aria-labelledby="generation-settings-title">
    <div class="upload-panel">
      <div class="upload-heading">
        <h2 id="generation-settings-title">Generation Settings</h2>
        <button class="control-button" id="generation-settings-close-button" type="button"
          aria-label="Close generation settings">Close</button>
      </div>
      <div class="generation-mode-setting">
        <label class="upload-option" for="generation-mode">Generation mode</label>
        <select class="control-button" id="generation-mode">
          <option value="parallel">Parallel chunks</option>
          <option value="sequential">Sequential chunks</option>
          <option value="agentic" selected>Agentic</option>
        </select>
        <span class="setting-help" tabindex="0"
          title="Parallel and sequential modes process pre-split chunks. Agentic mode explores files with repository tools, saves full graph checkpoints, and compacts context as it approaches the model limit.">?</span>
      </div>
      <div class="api-auth-controls">
        <p class="upload-option api-status-row">API: <span id="api-status" aria-live="polite">Checking...</span></p>
        <button class="control-button" id="openrouter-sign-in-button" type="button">Auth via OpenRouter</button>
      </div>
    </div>
  </dialog>
  <dialog class="upload-dialog" id="export-dialog" aria-labelledby="export-dialog-title">
    <div class="upload-panel">
      <div class="upload-heading">
        <h2 id="export-dialog-title">Import / Export Graph</h2>
        <button class="control-button" id="export-close-button" type="button"
          aria-label="Close export window">Close</button>
      </div>
      <label class="upload-field" for="import-graph-file">
        Import a graph file (.gr)
        <input id="import-graph-file" type="file" accept=".gr,text/plain" hidden>
      </label>
      <button class="control-button" id="import-graph-button" type="button">Choose graph file</button>
      <span id="import-graph-status" aria-live="polite"></span>
      <button class="control-button" id="export-graph-gr" type="button" disabled>Download graph.gr</button>
    </div>
  </dialog>
  <script type="application/json" id="graph-data">{{GRAPH_JSON}}</script>
  <script type="application/json" id="source-data">{{SOURCE_JSON}}</script>
  <script type="application/json" id="system-prompt">{{SYSTEM_PROMPT_JSON}}</script>
  <script type="application/json" id="default-api-key-a">{{DEFAULT_API_KEY_FIRST_JSON}}</script>
  <script type="application/json" id="default-api-key-b">{{DEFAULT_API_KEY_SECOND_JSON}}</script>
  <pre hidden id="codemap-core-wasm">{{CODEMAP_WASM}}</pre>
  <pre hidden id="elk-license">{{ELK_LICENSE}}</pre>
  <pre hidden id="elkjs-libavoid-license">{{LIBAVOID_LICENSE}}</pre>
  <pre hidden id="libavoid-js-license">{{LIBAVOID_JS_LICENSE}}</pre>
  <pre hidden id="libavoid-wasm">{{LIBAVOID_WASM}}</pre>
  <pre hidden id="markdown-it-license">{{MARKDOWN_IT_LICENSE}}</pre>
  <pre hidden id="purify-license">{{PURIFY_LICENSE}}</pre>
  <pre hidden id="purify-mpl-license">{{PURIFY_MPL_LICENSE}}</pre>
  <script>{{ELK_JS}}</script>
  <script>{{LIBAVOID_JS}}</script>
  <script>{{HIGHLIGHT_JS}}</script>
  <script>{{MARKDOWN_IT_JS}}</script>
  <script>{{PURIFY_JS}}</script>
  <script>{{CODEMAP_BINDINGS_JS}}</script>
  <script>
    const pageHeader = document.querySelector(".page-header");
    const defaultSidebarNodes = [...pageHeader.childNodes];
    const graphDetails = document.getElementById("graph-details");
    const modelSelect = document.getElementById("model-select");
    const modelSearch = document.getElementById("model-search");
    const modelPicker = document.getElementById("model-picker");
    const modelMenu = document.getElementById("model-menu");
    const modelOptions = document.getElementById("model-options");
    const authButton = document.getElementById("openrouter-sign-in-button");
    const generationSettingsButton = document.getElementById("generation-settings-button");
    const generationSettingsButtonParent = generationSettingsButton.parentNode;
    const generationSettingsButtonNextSibling = generationSettingsButton.nextSibling;
    const generationSettingsDialog = document.getElementById("generation-settings-dialog");
    const generationSettingsCloseButton = document.getElementById("generation-settings-close-button");
    const generationMode = document.getElementById("generation-mode");
    const exportButton = document.getElementById("export-button");
    const exportDialog = document.getElementById("export-dialog");
    const exportCloseButton = document.getElementById("export-close-button");
    const exportGraphGrButton = document.getElementById("export-graph-gr");
    const importGraphFile = document.getElementById("import-graph-file");
    const importGraphButton = document.getElementById("import-graph-button");
    const importGraphStatus = document.getElementById("import-graph-status");
    const modelControls = document.querySelector(".model-controls");
    const modelControlsParent = modelControls.parentNode;
    const modelControlsNextSibling = modelControls.nextSibling;
    const uploadCodeButton = document.getElementById("upload-code-button");
    const uploadDialog = document.getElementById("upload-dialog");
    const uploadFiles = document.getElementById("upload-files");
    const uploadDropzone = document.getElementById("upload-dropzone");
    const uploadBrowseButton = document.getElementById("upload-browse-button");
    const githubRepositoryUrl = document.getElementById("github-repository-url");
    const uploadCloseButton = document.getElementById("upload-close-button");
    const uploadPickerStatus = document.getElementById("upload-picker-status");
    const generateButton = document.getElementById("generate-button");
    let projectFiles = [];
    let embeddedSources = {};
    let generatedGraphSource = "";
    let workspaceReady = false;
    let generationInProgress = false;
    let generationController = null;
    const defaultApiKey =
      JSON.parse(document.getElementById("default-api-key-a").textContent) +
      JSON.parse(document.getElementById("default-api-key-b").textContent);
    const nodeChats = new Map();
    const refreshNodeChatContextStatuses = () => {
      for (const chat of nodeChats.values()) chat.updateContextStatus?.();
    };
    uploadCodeButton.disabled = true;
    generateButton.disabled = true;
    const updateGenerateButtonState = () => {
      generateButton.disabled = !workspaceReady || generationInProgress;
      generateButton.setAttribute(
        "aria-disabled",
        String(projectFiles.length === 0 || generationInProgress || !workspaceReady)
      );
    };
    const updateGenerationControls = () => {
      if (generationInProgress) closeModelMenu();
      modelSelect.disabled = generationInProgress || availableModels.length === 0;
      generationMode.disabled = generationInProgress;
      exportButton.disabled = generationInProgress;
      importGraphFile.disabled = generationInProgress;
      importGraphButton.disabled = generationInProgress;
      exportGraphGrButton.disabled = generationInProgress || !generatedGraphSource;
    };
    updateGenerateButtonState();
    let openRouterKey = sessionStorage.getItem("openrouter-api-key") || "";
    const WORKSPACE_DB_NAME = "codemap-workspace";
    const WORKSPACE_STORE_NAME = "state";
    const SAVED_MODEL_KEY = "codemap-selected-model";
    const MODEL_CATALOG_KEY = "model-catalog";
    const MODEL_CATALOG_TTL_MS = 60 * 60 * 1000;
    const CHAT_TOKENS_PER_CHAR = 3.5;
    const CHAT_SYSTEM_OVERHEAD_TOKENS = 3072;
    const CHAT_FALLBACK_CONTEXT_WINDOW = 128000;
    const SAVED_SIDEBAR_WIDTH_KEY = "codemap-sidebar-width";
    const readSavedNumber = key => {
      try {
        const value = Number(localStorage.getItem(key));
        return Number.isFinite(value) && value > 0 ? value : null;
      } catch (error) {
        console.warn("Could not read saved CodeMap settings:", error);
        return null;
      }
    };
    const readSavedModel = key => {
      try {
        return localStorage.getItem(key) || "";
      } catch (error) {
        console.warn("Could not read saved CodeMap settings:", error);
        return "";
      }
    };
    let savedSidebarWidth = readSavedNumber(SAVED_SIDEBAR_WIDTH_KEY);
    let savedModelId = readSavedModel(SAVED_MODEL_KEY);
    const saveSetting = (key, value) => {
      try {
        localStorage.setItem(key, String(value));
      } catch (error) {
        console.error("Could not save CodeMap setting:", error);
      }
    };
    const openWorkspaceDatabase = () => new Promise((resolve, reject) => {
      const request = indexedDB.open(WORKSPACE_DB_NAME, 1);
      request.onupgradeneeded = () => {
        request.result.createObjectStore(WORKSPACE_STORE_NAME, {keyPath: "id"});
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("Could not open browser storage."));
      request.onblocked = () => reject(new Error("Browser storage upgrade is blocked by another CodeMap tab."));
    });
    const workspaceDatabasePromise = openWorkspaceDatabase();
    const getWorkspaceItem = async id => {
      const database = await workspaceDatabasePromise;
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(WORKSPACE_STORE_NAME, "readonly");
        const request = transaction.objectStore(WORKSPACE_STORE_NAME).get(id);
        request.onsuccess = () => resolve(request.result?.value);
        request.onerror = () => reject(request.error || new Error("Could not read saved browser data."));
        transaction.onabort = () => reject(transaction.error || new Error("Could not read saved browser data."));
      });
    };
    const setWorkspaceItem = async (id, value) => {
      const database = await workspaceDatabasePromise;
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(WORKSPACE_STORE_NAME, "readwrite");
        transaction.objectStore(WORKSPACE_STORE_NAME).put({id, value});
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error || new Error("Could not save browser data."));
        transaction.onabort = () => reject(transaction.error || new Error("Could not save browser data."));
      });
    };
    const saveCurrentGraph = () => setWorkspaceItem("generated-graph", {
      graph,
      source: generatedGraphSource
    });
    const generationFailureLabel = error =>
      /429|rate.?limit/i.test(error) ? "Generation failed: ratelimited" : "Generation failed";
    const apiStatus = document.getElementById("api-status");
    const sourceLanguageByExtension = {
      cjs: "javascript",
      bash: "bash",
      c: "c",
      cc: "cpp",
      clj: "clojure",
      cljc: "clojure",
      cljx: "clojure",
      cmake: "cmake",
      cpp: "cpp",
      cs: "csharp",
      cxx: "cpp",
      css: "css",
      dart: "dart",
      dockerfile: "dockerfile",
      ex: "elixir",
      exs: "elixir",
      gradle: "gradle",
      go: "go",
      h: "c",
      htm: "xml",
      html: "xml",
      hpp: "cpp",
      hxx: "cpp",
      ini: "ini",
      java: "java",
      js: "javascript",
      jsx: "javascript",
      json: "json",
      kt: "kotlin",
      kts: "kotlin",
      lua: "lua",
      m: "objectivec",
      md: "markdown",
      mjs: "javascript",
      mts: "typescript",
      php: "php",
      pl: "perl",
      pm: "perl",
      proto: "protobuf",
      ps1: "powershell",
      py: "python",
      rb: "ruby",
      rs: "rust",
      scss: "scss",
      scala: "scala",
      sh: "bash",
      sql: "sql",
      swift: "swift",
      toml: "toml",
      ts: "typescript",
      tsx: "typescript",
      vue: "xml",
      xml: "xml",
      yaml: "yaml",
      yml: "yaml"
    };
    const sourceLanguage = path => {
      const filename = path.split(/[\\/]/).pop().toLowerCase();
      const extension = filename.split(".").pop();
      const language = sourceLanguageByExtension[extension];
      return language && hljs.getLanguage(language) ? language : null;
    };
    const highlightSourceCode = (path, source) => {
      const language = sourceLanguage(path);
      return language
        ? hljs.highlight(source, {language}).value
        : hljs.highlightAuto(source).value;
    };
    const chatMarkdown = window.markdownit({
      html: false,
      linkify: true,
      breaks: true,
      highlight: (source, language) => {
        const highlighted = language && hljs.getLanguage(language)
          ? hljs.highlight(source, {language}).value
          : hljs.highlightAuto(source).value;
        return `<pre class="hljs"><code>${highlighted}</code></pre>`;
      }
    });
    const renderChatMarkdown = content =>
      DOMPurify.sanitize(chatMarkdown.render(content), {USE_PROFILES: {html: true}});
    const DEFAULT_MODEL_ID = "openrouter/free";
    const recommendedModelIds = new Set([DEFAULT_MODEL_ID]);
    let availableModels = [];
    let selectedModelId = "";
    const getEffectiveModelId = () => selectedModelId;
    const restoreSidebarControls = () => {
      closeModelMenu();
      updateModelSelectLabel();
      modelSelect.classList.remove("node-chat-tool-button");
      generationSettingsButton.classList.remove("node-chat-tool-button");
      generationSettingsButtonParent.insertBefore(
        generationSettingsButton,
        generationSettingsButtonNextSibling
      );
      modelControlsParent.insertBefore(modelControls, modelControlsNextSibling);
      pageHeader.replaceChildren(...defaultSidebarNodes);
    };
    const showNodePanel = node => {
      closeModelMenu();
      const panel = document.createElement("section");
      panel.className = "node-panel";
      panel.setAttribute("aria-label", `${node.name || "Node"} details`);

      const heading = document.createElement("div");
      heading.className = "node-panel-heading";
      const titleRow = document.createElement("div");
      titleRow.className = "node-panel-title-row";
      const title = document.createElement("h1");
      title.className = "node-panel-title";
      title.textContent = node.name || "";
      const closeButton = document.createElement("button");
      closeButton.className = "control-button";
      closeButton.type = "button";
      closeButton.textContent = "Close";
      closeButton.setAttribute("aria-label", "Close node details");
      closeButton.addEventListener("click", restoreSidebarControls);
      titleRow.append(title, closeButton);

      const description = document.createElement("p");
      description.className = "node-panel-description";
      description.textContent = node.description || "";
      heading.append(titleRow, description);

      const tabs = document.createElement("div");
      tabs.className = "node-panel-tabs";
      tabs.setAttribute("role", "tablist");
      tabs.setAttribute("aria-label", "Node details");
      const content = document.createElement("div");
      content.className = "node-panel-content";
      content.setAttribute("role", "tabpanel");
      content.setAttribute("aria-live", "polite");
      const chatControls = document.createElement("div");
      chatControls.className = "node-chat-controls";
      const chatMessages = document.createElement("div");
      chatMessages.className = "node-chat-messages";
      chatMessages.setAttribute("role", "log");
      chatMessages.setAttribute("aria-live", "polite");
      const chatContextStatus = document.createElement("div");
      chatContextStatus.className = "node-chat-context-status";
      chatContextStatus.setAttribute("role", "status");
      chatContextStatus.setAttribute("aria-live", "polite");
      const chatComposer = document.createElement("div");
      chatComposer.className = "node-chat-composer";
      const chatInput = document.createElement("textarea");
      chatInput.className = "node-chat-input";
      chatInput.rows = 3;
      chatInput.placeholder = "Ask about the code...";
      chatInput.setAttribute("aria-label", "Chat message");
      const chatToolbar = document.createElement("div");
      chatToolbar.className = "node-chat-toolbar";
      const chatActions = document.createElement("div");
      chatActions.className = "node-chat-actions";
      modelSelect.classList.add("node-chat-tool-button");
      generationSettingsButton.classList.add("node-chat-tool-button");
      const sendChatMessageButton = document.createElement("button");
      sendChatMessageButton.id = "send-chat-message-button";
      sendChatMessageButton.type = "button";
      sendChatMessageButton.innerHTML =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>';
      sendChatMessageButton.setAttribute("aria-label", "Send message");
      sendChatMessageButton.title = "Send message";
      chatActions.append(modelControls, generationSettingsButton);
      chatToolbar.append(chatActions, sendChatMessageButton);
      chatComposer.append(chatInput, chatToolbar);
      chatControls.append(chatMessages, chatContextStatus, chatComposer);
      const chat = nodeChats.get(node.id) || {messages: [], displayMessages: [], pending: false};
      nodeChats.set(node.id, chat);
      chat.input = chatInput;
      chat.sendButton = sendChatMessageButton;
      const estimateMessagesTokens = messages => messages.reduce(
        (tokens, message) => tokens + Math.ceil(
          (typeof message.content === "string" ? message.content.length : 0) /
          CHAT_TOKENS_PER_CHAR
        ),
        0
      );
      const getContextWindow = (modelId = selectedModelId) => {
        const model = availableModels.find(candidate => candidate.id === modelId);
        const contextLength = model?.context_length;
        return Number.isSafeInteger(contextLength) && contextLength > 0
          ? {tokens: contextLength, isFallback: false}
          : {tokens: CHAT_FALLBACK_CONTEXT_WINDOW, isFallback: true};
      };
      const estimateContextTokens = (messages, modelId = selectedModelId) => {
        const checkpoint = chat.usageCheckpoint;
        if (
          checkpoint &&
          checkpoint.modelId === modelId &&
          Number.isSafeInteger(checkpoint.messageCount) &&
          checkpoint.messageCount <= messages.length
        ) {
          return checkpoint.tokens + estimateMessagesTokens(messages.slice(checkpoint.messageCount));
        }
        return CHAT_SYSTEM_OVERHEAD_TOKENS + estimateMessagesTokens(messages);
      };
      const compactNumber = new Intl.NumberFormat(undefined, {
        notation: "compact",
        maximumSignificantDigits: 2
      });
      const updateContextStatus = () => {
        const messages = chat.pendingMessages || chat.messages;
        const usedTokens = estimateContextTokens(messages);
        const contextWindow = getContextWindow();
        const remainingTokens = Math.max(0, contextWindow.tokens - usedTokens);
        const overBy = Math.max(0, usedTokens - contextWindow.tokens);
        chatContextStatus.textContent = contextWindow.isFallback
          ? `Est. ${compactNumber.format(usedTokens)} / ~${compactNumber.format(contextWindow.tokens)} tokens; model limit unavailable`
          : overBy > 0
            ? `Est. ${compactNumber.format(usedTokens)} / ${compactNumber.format(contextWindow.tokens)} tokens; over by ~${compactNumber.format(overBy)}`
            : `Est. ${compactNumber.format(usedTokens)} / ${compactNumber.format(contextWindow.tokens)} tokens; ~${compactNumber.format(remainingTokens)} left`;
        chatContextStatus.title =
          `Approximate context usage: ${usedTokens.toLocaleString()} of ${contextWindow.tokens.toLocaleString()} tokens` +
          (contextWindow.isFallback ? " (128k fallback; model metadata unavailable)." : ".");
      };
      chat.updateContextStatus = updateContextStatus;
      updateContextStatus();
      chatInput.disabled = chat.pending;
      sendChatMessageButton.disabled = chat.pending;
      const renderChatMessages = () => {
        chatMessages.replaceChildren();
        for (const [displayIndex, message] of chat.displayMessages.entries()) {
          const bubble = document.createElement(message.role === "user" ? "button" : "div");
          bubble.className = `node-chat-message node-chat-message-${message.role}`;
          if (message.role === "user") {
            bubble.type = "button";
            bubble.disabled = chat.pending;
            bubble.setAttribute("aria-label", `Edit message: ${message.content}`);
            bubble.title = "Click to edit this message";
            bubble.addEventListener("click", () => openUserMessageEditor(displayIndex));
          }
          if (message.role === "assistant") {
            bubble.innerHTML = renderChatMarkdown(message.content);
          } else {
            bubble.textContent = message.content;
          }
          chatMessages.append(bubble);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
      };
      renderChatMessages();
      const addChatMessage = (role, content, requestIndex) => {
        chat.displayMessages.push({role, content, requestIndex});
        renderChatMessages();
      };
      const addSuccessfulToolMessages = (toolCalls, requestIndex) => {
        for (const toolCall of toolCalls) {
          if (toolCall.error) continue;
          if (typeof toolCall.tool !== "string" || typeof toolCall.command !== "string") {
            console.error("OpenRouter returned invalid tool-call metadata:", toolCall);
            continue;
          }
          addChatMessage("tool", toolCall.command, requestIndex);
        }
      };
      const buildUserRequestContent = (userRequest, requestIndex) => requestIndex === 0
        ? [
          `Selected node:\n${JSON.stringify(node, null, 2)}`,
          `Full graph:\n${JSON.stringify(graph, null, 2)}`,
          "Focus only on the selected node; use the full graph as context.",
          "The next part is the user's request:",
          userRequest
        ].join("\n\n")
        : userRequest;
      const setChatPending = pending => {
        chat.pending = pending;
        chat.input.disabled = pending;
        chat.sendButton.disabled = pending;
        for (const userMessage of chatMessages.querySelectorAll("button.node-chat-message-user")) {
          userMessage.disabled = pending;
        }
        if (chat.editSubmitButton) chat.editSubmitButton.disabled = pending;
        if (chat.editCancelButton) chat.editCancelButton.disabled = pending;

      const repository = repositoryName?.replace(/\.git$/i, "");

          } catch (error) {
            self.postMessage({id: data.id, error: error.message || String(error)});
          }
        };
      `;
      const workerUrl = URL.createObjectURL(new Blob(
        [bundle.textContent, workerRuntime],
        {type: "text/javascript"}
      ));
      const worker = new Worker(workerUrl);
      const requests = new Map();
      let nextRequestId = 0;
      let workerFailure = null;
      const failRequests = error => {
        for (const {reject} of requests.values()) reject(error);
        requests.clear();
      };
      worker.addEventListener("message", ({data}) => {
        const request = requests.get(data.id);
        if (!request) return;
        requests.delete(data.id);
        if (data.error) request.reject(new Error(data.error));
        else request.resolve(new Map(data.routes));
      });
      worker.addEventListener("error", event => {
        workerFailure = new Error(event.message || "Graph-routing worker failed.");
        failRequests(workerFailure);
      });
      return {
        request(type, payload) {
          if (workerFailure) return Promise.reject(workerFailure);
          const id = nextRequestId++;
          return new Promise((resolve, reject) => {
            requests.set(id, {resolve, reject});
            try {
              worker.postMessage({id, type, ...payload});
            } catch (error) {
              requests.delete(id);
              reject(error);
            }
          });
        },
        destroy() {
          failRequests(new Error("Graph-routing worker was replaced."));
          worker.terminate();
          URL.revokeObjectURL(workerUrl);
        }
      };
    };
    let activeRoutingWorker = null;

    const combineReverseDirectedEdges = edges => {
      const combined = [];
      const used = new Set();
      const directionOf = edge => edge.arrow_end
        ? [edge.from, edge.to]
        : [edge.to, edge.from];
      for (let index = 0; index < edges.length; index++) {
        if (used.has(index)) continue;
        const edge = {...edges[index]};
        const isSingleDirection = edge.arrow_start !== edge.arrow_end;
        if (isSingleDirection && edge.from !== edge.to) {
          const [source, target] = directionOf(edge);
          const reverseIndex = edges.findIndex((candidate, candidateIndex) => {
            if (candidateIndex <= index || used.has(candidateIndex) ||
              candidate.arrow_start === candidate.arrow_end ||
              candidate.label !== edge.label || candidate.dotted !== edge.dotted ||
              candidate.from === candidate.to) {
              return false;
            }
            const [candidateSource, candidateTarget] = directionOf(candidate);
            return candidateSource === target && candidateTarget === source;
          });
          if (reverseIndex !== -1) {
            edge.arrow_start = true;
            edge.arrow_end = true;
            used.add(reverseIndex);
          }
        }
        used.add(index);
        combined.push(edge);
      }
      return combined;
    };

    const layoutGraphWithElk = async graph => {
      if (graph.nodes.length === 0) return [];
      const nodeIds = new Set(graph.nodes.map(node => node.id));
      const elkEdges = graph.edges.map((edge, index) => {
        if (!nodeIds.has(edge.from) || !nodeIds.has(edge.to)) {
          throw new Error(`Graph edge references an unknown node: ${edge.from} -> ${edge.to}`);
        }
        const reversed = edge.arrow_start && !edge.arrow_end;
        return {
          id: `edge-${index}`,
          sources: [reversed ? edge.to : edge.from],
          targets: [reversed ? edge.from : edge.to]
        };
      });
      const layout = await elk.layout({
        id: "root",
        layoutOptions: {
          "elk.algorithm": "layered",
          "elk.direction": graph.direction === "LR" ? "RIGHT" : "DOWN",
          "elk.edgeRouting": "ORTHOGONAL",
          "elk.spacing.nodeNode": "72",
          "elk.layered.spacing.nodeNodeBetweenLayers": "80",
          "elk.padding": "[top=48,left=48,bottom=48,right=48]"
        },
        children: graph.nodes.map(node => ({
          id: node.id,
          width: node.width,
          height: node.height
        })),
        edges: elkEdges
      });
      const positions = new Map(layout.children.map(node => [node.id, node]));
      for (const node of graph.nodes) {
        const position = positions.get(node.id);
        if (!position || !Number.isFinite(position.x) || !Number.isFinite(position.y)) {
          throw new Error(`ELK did not place graph node '${node.id}'`);
        }
        node.x = position.x;
        node.y = position.y;
      }
      graph.width = layout.width;
      graph.height = layout.height;
    };

    const renderGraph = async graph => {
      graph = {...graph, edges: combineReverseDirectedEdges(graph.edges)};
      const selfLoopRoute = node => {
        const clearance = 24;
        const centerX = node.x + node.width / 2;
        const centerY = node.y + node.height / 2;
        const outerX = node.x + node.width + clearance;
        const outerY = node.y - clearance;
        return [
          {x: node.x + node.width, y: centerY},
          {x: outerX, y: centerY},
          {x: outerX, y: outerY},
          {x: centerX, y: outerY},
          {x: centerX, y: node.y}
        ];
      };
      await layoutGraphWithElk(graph);
      const routingEdges = graph.edges.flatMap((edge, index) =>
        edge.from === edge.to
          ? []
          : [{id: `edge-${index}`, source: edge.from, target: edge.to}]
      );
      let nextRoutingWorker = null;
      let latestRoutes = new Map();
      if (routingEdges.length > 0) {
        const routingWorker = createRoutingWorker();
        try {
          latestRoutes = await routingWorker.request("init", {
            wasmUrl: libavoidWasmUrl,
            graph: {
              id: "root",
              children: graph.nodes.map(node => ({
                id: node.id,
                x: node.x,
                y: node.y,
                width: node.width,
                height: node.height
              })),
              edges: routingEdges
            },
            options: {
              routingType: "orthogonal",
              shapeBufferDistance: 8,
              idealNudgingDistance: 12,
              nudgeOrthogonalSegmentsConnectedToShapes: true,
              nudgeOrthogonalTouchingColinearSegments: true,
              performUnifyingNudgingPreprocessingStep: true,
              nudgeSharedPathsWithCommonEndPoint: true
            }
          });
          nextRoutingWorker = routingWorker;
        } catch (error) {
          routingWorker.destroy();
          throw error;
        }
      }
      activeRoutingWorker?.destroy();
      activeRoutingWorker = nextRoutingWorker;
      svg.replaceChildren();
      graphDetails.replaceChildren();
      if (graph.name) {
        const title = document.createElement("h1");
        title.textContent = graph.name;
        graphDetails.append(title);
      }
      if (graph.description) {
        const description = document.createElement("p");
        description.className = "graph-description";
        description.textContent = graph.description;
        graphDetails.append(description);
      }
      const initialGraphWidth = graph.width;
      const initialGraphHeight = graph.height;
      const viewportPadding = 48;
      let viewMinX = 0;
      let viewMinY = 0;
      let viewWidth = graph.width;
      let viewHeight = graph.height;
      let viewportInitialized = false;
      let crossBackground = null;

      const updateSvgViewport = () => {
        const previousMinX = viewMinX;
        const previousMinY = viewMinY;
        const minX = Math.min(0, ...graph.nodes.map(node => node.x - viewportPadding)) -
          canvas.clientWidth;
        const minY = Math.min(0, ...graph.nodes.map(node => node.y - viewportPadding)) -
          canvas.clientHeight;
        const maxX = Math.max(
          initialGraphWidth,
          ...graph.nodes.map(node => node.x + node.width + viewportPadding)
        ) + canvas.clientWidth;
        const maxY = Math.max(
          initialGraphHeight,
          ...graph.nodes.map(node => node.y + node.height + viewportPadding)
        ) + canvas.clientHeight;
        viewMinX = minX;
        viewMinY = minY;
        viewWidth = maxX - minX;
        viewHeight = maxY - minY;
        svg.setAttribute("width", viewWidth);
        svg.setAttribute("height", viewHeight);
        svg.setAttribute("viewBox", `${viewMinX} ${viewMinY} ${viewWidth} ${viewHeight}`);
        if (crossBackground) {
          crossBackground.setAttribute("x", viewMinX);
          crossBackground.setAttribute("y", viewMinY);
          crossBackground.setAttribute("width", viewWidth);
          crossBackground.setAttribute("height", viewHeight);
        }
        if (viewportInitialized) {
          canvas.scrollLeft += previousMinX - viewMinX;
          canvas.scrollTop += previousMinY - viewMinY;
        } else {
          viewportInitialized = true;
          canvas.scrollTo(canvas.clientWidth, canvas.clientHeight);
        }
      };

      if (resizeGraphViewport) {
        window.removeEventListener("resize", resizeGraphViewport);
      }
      resizeGraphViewport = updateSvgViewport;
      window.addEventListener("resize", resizeGraphViewport);
      updateSvgViewport();

      const definitions = makeSvgElement("defs");
      if (document.documentElement.dataset.pattern === "crosses") {
        const crossPattern = makeSvgElement("pattern", {
          id: "cross-pattern",
          width: "200",
          height: "200",
          patternUnits: "userSpaceOnUse"
        });
        crossPattern.append(makeSvgElement("path", {
          d: "M100 96.5v7M96.5 100h7",
          fill: "none",
          stroke: "var(--pattern-line)",
          "stroke-width": "1",
          "stroke-linecap": "round"
        }));
        definitions.append(crossPattern);
        svg.append(definitions);
        crossBackground = makeSvgElement("rect", {
          x: viewMinX,
          y: viewMinY,
          width: viewWidth,
          height: viewHeight,
          fill: "url(#cross-pattern)"
        });
        svg.append(crossBackground);
      } else {
        svg.append(definitions);
      }
      const arrow = makeSvgElement("marker", {
        id: "arrow",
        markerWidth: "8",
        markerHeight: "6",
        markerUnits: "userSpaceOnUse",
        viewBox: "0 0 8 6",
        refX: "7",
        refY: "3",
        orient: "auto-start-reverse"
      });
      arrow.append(makeSvgElement("path", {
        d: "M1,1 L6,3 L1,5",
        fill: "none",
        stroke: "var(--connection-color)",
        "stroke-width": "2",
        "stroke-linecap": "round",
        "stroke-linejoin": "round"
      }));
      definitions.append(arrow);
      const edgeLayer = makeSvgElement("g", {class: "edges"});
      const edgeLabelLayer = makeSvgElement("g", {class: "edge-labels"});
      const nodeLayer = makeSvgElement("g", {class: "nodes"});
      svg.append(edgeLayer, edgeLabelLayer, nodeLayer);

      const nodesById = new Map(graph.nodes.map(node => [node.id, node]));
      const computeRoutes = () => graph.edges.map((edge, index) => {
        const from = nodesById.get(edge.from);
        const to = nodesById.get(edge.to);
        if (!from || !to) {
          throw new Error(`Graph edge references an unknown node: ${edge.from} -> ${edge.to}`);
        }
        if (edge.from === edge.to) return selfLoopRoute(from);
        const route = latestRoutes.get(`edge-${index}`);
        if (!route) {
          throw new Error(`libavoid did not route graph edge: ${edge.from} -> ${edge.to}`);
        }
        return [route.sourcePoint, ...route.bendPoints, route.targetPoint];
      });

      const positionAtRouteFraction = (points, fraction) => {
        const lengths = points.slice(1).map((point, index) =>
          Math.hypot(point.x - points[index].x, point.y - points[index].y)
        );
        const targetLength = lengths.reduce((total, length) => total + length, 0) * fraction;
        let traversed = 0;
        for (let index = 0; index < lengths.length; index++) {
          const length = lengths[index];
          if (length > 0 && traversed + length >= targetLength) {
            const start = points[index];
            const end = points[index + 1];
            const segmentFraction = (targetLength - traversed) / length;
            return {
              x: start.x + (end.x - start.x) * segmentFraction,
              y: start.y + (end.y - start.y) * segmentFraction,
              horizontal: start.y === end.y,
              segmentIndex: index
            };
          }
          traversed += length;
        }
        const lastIndex = points.length - 2;
        const last = points[lastIndex + 1];
        return {
          x: last.x,
          y: last.y,
          horizontal: points[lastIndex].y === last.y,
          segmentIndex: lastIndex
        };
      };

      const labelBoundsAt = (position, metrics) => {
        const baseline = position.horizontal
          ? position.y - metrics.offsetY - metrics.height / 2
          : position.y - 5;
        return {
          x: position.x + metrics.offsetX - 4,
          y: baseline + metrics.offsetY - 2,
          width: metrics.width + 8,
          height: metrics.height + 4
        };
      };
      const positionLabel = (labelText, position, metrics) => {
        const baseline = position.horizontal
          ? position.y - metrics.offsetY - metrics.height / 2
          : position.y - 5;
        labelText.setAttribute("x", position.x);
        labelText.setAttribute("y", baseline);
      };

      const overlapArea = (first, second) => {
        const width = Math.max(
          0,
          Math.min(first.x + first.width, second.x + second.width) - Math.max(first.x, second.x)
        );
        const height = Math.max(
          0,
          Math.min(first.y + first.height, second.y + second.height) - Math.max(first.y, second.y)
        );
        return width * height;
      };

      const roundedRoutePath = (points, radius = 12) => {
        if (points.length < 3) {
          return points.map((point, index) =>
            `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
          ).join(" ");
        }

        let path = `M ${points[0].x} ${points[0].y}`;
        for (let index = 1; index < points.length - 1; index++) {
          const previous = points[index - 1];
          const corner = points[index];
          const next = points[index + 1];
          const incomingLength = Math.hypot(corner.x - previous.x, corner.y - previous.y);
          const outgoingLength = Math.hypot(next.x - corner.x, next.y - corner.y);
          if (incomingLength === 0 || outgoingLength === 0) continue;

          const trim = Math.min(radius, incomingLength / 2, outgoingLength / 2);
          const before = {
            x: corner.x + (previous.x - corner.x) * (trim / incomingLength),
            y: corner.y + (previous.y - corner.y) * (trim / incomingLength)
          };
          const after = {
            x: corner.x + (next.x - corner.x) * (trim / outgoingLength),
            y: corner.y + (next.y - corner.y) * (trim / outgoingLength)
          };
          path += ` L ${before.x} ${before.y} Q ${corner.x} ${corner.y} ${after.x} ${after.y}`;
        }

        const last = points[points.length - 1];
        return `${path} L ${last.x} ${last.y}`;
      };

      const isInsideNode = (point, node) =>
        point.x >= node.x && point.x <= node.x + node.width &&
        point.y >= node.y && point.y <= node.y + node.height;

      const intersectNodeBoundary = (inside, outside, node) => {
        const dx = outside.x - inside.x;
        const dy = outside.y - inside.y;
        const tx = dx > 0
          ? (node.x + node.width - inside.x) / dx
          : dx < 0
            ? (node.x - inside.x) / dx
            : Infinity;
        const ty = dy > 0
          ? (node.y + node.height - inside.y) / dy
          : dy < 0
            ? (node.y - inside.y) / dy
            : Infinity;
        const t = Math.min(tx, ty);
        if (!Number.isFinite(t) || t < 0 || t > 1) {
          throw new Error("Could not find where an edge route exits a node");
        }
        return {x: inside.x + dx * t, y: inside.y + dy * t};
      };

      const clipRouteAtNode = (points, node) => {
        for (let index = 1; index < points.length; index++) {
          if (!isInsideNode(points[index], node)) {
            return [
              intersectNodeBoundary(points[index - 1], points[index], node),
              ...points.slice(index)
            ];
          }
        }
        return points;
      };

      const edgeElements = graph.edges.map(edge => {
        const path = makeSvgElement("path", {
          class: edge.dotted ? "edge dotted" : "edge"
        });
        if (edge.arrow_start) path.setAttribute("marker-start", "url(#arrow)");
        if (edge.arrow_end) path.setAttribute("marker-end", "url(#arrow)");
        edgeLayer.append(path);

        let label = null;
        let labelText = null;
        let labelBackground = null;
        if (edge.label) {
          label = makeSvgElement("g", {
            class: "edge-label",
            "pointer-events": "none"
          });
          labelBackground = makeSvgElement("rect", {
            fill: "var(--page-bg)",
            stroke: "#fff",
            "stroke-width": "1",
            rx: "4",
            ry: "4"
          });
          labelText = makeSvgElement("text", {
            "text-anchor": "middle",
            x: "0",
            y: "0"
          });
          labelText.textContent = edge.label;
          label.append(labelBackground, labelText);
          edgeLabelLayer.append(label);
        }
        return {path, label, labelText, labelBackground};
      });
      const labelMetrics = new Map(edgeElements
        .filter(({labelText}) => labelText)
        .map(({labelText}) => {
          const bounds = labelText.getBBox();
          return [labelText, {
            offsetX: bounds.x,
            offsetY: bounds.y,
            width: bounds.width,
            height: bounds.height
          }];
        }));

      let routingRequestInFlight = false;
      let pendingRoutingMove = null;
      let latestRoutingRevision = 0;
      let hideEdgesTimer = null;
      const ROUTE_HIDE_DELAY_MS = 100;
      const setConnectionsVisible = visible => {
        const visibility = visible ? "visible" : "hidden";
        edgeLayer.style.visibility = visibility;
        edgeLabelLayer.style.visibility = visibility;
      };
      const pumpRoutingQueue = () => {
        if (routingRequestInFlight || !pendingRoutingMove || !activeRoutingWorker) return;
        const move = pendingRoutingMove;
        pendingRoutingMove = null;
        routingRequestInFlight = true;
        const worker = activeRoutingWorker;
        if (hideEdgesTimer !== null) clearTimeout(hideEdgesTimer);
        hideEdgesTimer = setTimeout(() => {
          hideEdgesTimer = null;
          if (worker === activeRoutingWorker &&
            (routingRequestInFlight || pendingRoutingMove !== null)) {
            setConnectionsVisible(false);
          }
        }, Math.max(0, move.requestedAt + ROUTE_HIDE_DELAY_MS - performance.now()));
        worker.request("move", move).then(routes => {
          if (worker !== activeRoutingWorker) return;
          routingRequestInFlight = false;
          if (move.revision === latestRoutingRevision && pendingRoutingMove === null) {
            if (hideEdgesTimer !== null) {
              clearTimeout(hideEdgesTimer);
              hideEdgesTimer = null;
            }
            latestRoutes = routes;
            updateEdgeRoutes();
          } else {
            pumpRoutingQueue();
          }
        }).catch(error => {
          if (worker !== activeRoutingWorker) return;
          routingRequestInFlight = false;
          if (pendingRoutingMove !== null) {
            pumpRoutingQueue();
          } else {
            if (hideEdgesTimer !== null) {
              clearTimeout(hideEdgesTimer);
              hideEdgesTimer = null;
            }
            setConnectionsVisible(true);
          }
          console.error("Graph edge routing failed:", error);
        });
      };
      const queueRoutingMove = node => {
        if (!activeRoutingWorker) {
          updateEdgeRoutes();
          return;
        }
        pendingRoutingMove = {
          nodeId: node.id,
          position: {x: node.x, y: node.y},
          revision: ++latestRoutingRevision,
          requestedAt: performance.now()
        };
        pumpRoutingQueue();
      };
      const updateEdgeRoutes = () => {
        const routes = computeRoutes();
        const occupiedBounds = graph.nodes.map(node => ({
          x: node.x,
          y: node.y,
          width: node.width,
          height: node.height
        }));
        routes.forEach((points, index) => {
          const edge = graph.edges[index];
          const from = nodesById.get(edge.from);
          const to = nodesById.get(edge.to);
          let visiblePoints;
          if (edge.from === edge.to) {
            visiblePoints = selfLoopRoute(from);
          } else {
            const clippedPoints = clipRouteAtNode(points, from);
            visiblePoints = clipRouteAtNode(clippedPoints.slice().reverse(), to).reverse();
          }
          const {path, labelText, labelBackground} = edgeElements[index];
          path.setAttribute("d", roundedRoutePath(visiblePoints));
          if (labelText && labelBackground) {
            const metrics = labelMetrics.get(labelText);
            if (!metrics) throw new Error("Missing edge label measurements");
            const labelFraction = edge.arrow_start !== edge.arrow_end ? 3 / 4 : 1 / 2;
            let selectedPosition = positionAtRouteFraction(visiblePoints, labelFraction);
            let selectedBounds = null;
            let leastOverlap = Infinity;
            const scorePosition = position => {
              const bounds = labelBoundsAt(position, metrics);
              const overlap = occupiedBounds.reduce(
                (total, previous) => total + overlapArea(bounds, previous),
                0
              );
              if (overlap < leastOverlap) {
                selectedPosition = position;
                selectedBounds = bounds;
                leastOverlap = overlap;
              }
              return overlap;
            };
            let foundFreePosition = scorePosition(selectedPosition) === 0;
            let intervals = [[0, labelFraction], [labelFraction, 1]];
            for (let depth = 0; depth < 3 && !foundFreePosition; depth++) {
              const nextIntervals = [];
              for (const [start, end] of intervals) {
                const fraction = (start + end) / 2;
                const position = positionAtRouteFraction(visiblePoints, fraction);
                if (scorePosition(position) === 0) {
                  selectedPosition = position;
                  selectedBounds = positionLabel(labelText, position);
                  foundFreePosition = true;
                  break;
                }
                nextIntervals.push([start, fraction], [fraction, end]);
              }
              intervals = nextIntervals;
            }
            if (selectedPosition && selectedBounds) {
              positionLabel(labelText, selectedPosition, metrics);
              labelBackground.setAttribute("x", selectedBounds.x);
              labelBackground.setAttribute("y", selectedBounds.y);
              labelBackground.setAttribute("width", selectedBounds.width);
              labelBackground.setAttribute("height", selectedBounds.height);
              occupiedBounds.push(selectedBounds);
            }
          }
        });
        setConnectionsVisible(true);
        return true;
      };
      updateEdgeRoutes();

      resetGraphView = () => {
        canvas.scrollTo({
          left: -viewMinX,
          top: -viewMinY,
          behavior: "smooth"
        });
      };

      const wrapText = (text, maxChars, maxLines) => {
        const lines = [];
        let current = "";
        let truncated = false;
        for (const word of text.split(/\s+/).filter(Boolean)) {
          if (current && current.length + 1 + word.length > maxChars) {
            lines.push(current);
            if (lines.length === maxLines) {
              truncated = true;
              break;
            }
            current = "";
          }
          current += `${current ? " " : ""}${word}`;
        }
        if (current && lines.length < maxLines) lines.push(current);
        if (!lines.length) lines.push("");
        if (truncated) lines[lines.length - 1] += "...";
        return lines;
      };

      const nodeTitleRowHeight = 33;
      const nodeDescriptionLineHeight = 12;
      const nodeDescriptionLineCount = 6;
      const nodeActionRowHeight = 26;
      const nodeBaseHeight = nodeTitleRowHeight +
        nodeDescriptionLineHeight * nodeDescriptionLineCount +
        nodeActionRowHeight;

      for (const node of graph.nodes) {
        const group = makeSvgElement("g", {class: "node"});
        group.setAttribute("transform", `translate(${node.x} ${node.y})`);
        const background = makeSvgElement("rect", {
          x: 0,
          y: 0,
          width: node.width,
          height: node.height,
          rx: 12,
          ry: 12
        });
        group.append(background);
        const title = node.name || "";
        const description = node.description || "";
        const titleElement = makeSvgElement("text", {
          class: "node-title",
          x: node.width / 2,
          y: 0,
          "text-anchor": "middle"
        });
        const descriptionLayer = makeSvgElement("g");
        const actionDivider = makeSvgElement("line", {
          class: "node-action-divider",
          stroke: "var(--line-color)",
          "stroke-width": "2"
        });
        const buttonDivider = makeSvgElement("line", {
          class: "node-action-divider",
          stroke: "var(--line-color)",
          "stroke-width": "2"
        });
        const makeNodeAction = (className, label, action) => {
          const control = makeSvgElement("g", {
            class: `node-action ${className}`,
            role: "button",
            tabindex: "0",
            "aria-label": label
          });
          const rect = makeSvgElement("rect", {rx: "3", ry: "3"});
          const text = makeSvgElement("text", {
            "text-anchor": "middle"
          });
          text.textContent = className === "node-expand" ? "expand" : "move";
          control.append(rect, text);
          control.addEventListener("click", event => {
            event.stopPropagation();
            action();
          });
          control.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              event.stopPropagation();
              action();
            }
          });
          return {control, rect, text};
        };
        const expandAction = makeNodeAction(
          "node-expand",
          "Open node details",
          () => showNodePanel(node)
        );
        const moveAction = makeNodeAction("node-move", "Move node by dragging", () => { });

        const updateNodeLayout = () => {
          const descriptionLines = description
            ? wrapText(description, 24, nodeDescriptionLineCount)
            : [];
          node.height = nodeBaseHeight;
          background.setAttribute("height", node.height);
          titleElement.textContent = wrapText(title, 24, 1)[0];
          const titleBounds = titleElement.getBBox();
          titleElement.setAttribute(
            "y",
            nodeTitleRowHeight / 2 - (titleBounds.y + titleBounds.height / 2)
          );
          descriptionLayer.replaceChildren();
          const descriptionAreaHeight = node.height - nodeTitleRowHeight - nodeActionRowHeight;
          const descriptionTextHeight = descriptionLines.length * nodeDescriptionLineHeight;
          const descriptionFirstLineY = nodeTitleRowHeight +
            (descriptionAreaHeight - descriptionTextHeight) / 2 + 10;
          descriptionLines.forEach((line, index) => {
            const text = makeSvgElement("text", {
              class: "node-description",
              x: node.width / 2,
              y: descriptionFirstLineY + index * nodeDescriptionLineHeight,
              "text-anchor": "middle"
            });
            text.textContent = line;
            descriptionLayer.append(text);
          });

          const actionTop = node.height - nodeActionRowHeight;
          actionDivider.setAttribute("x1", "1");
          actionDivider.setAttribute("x2", node.width - 1);
          actionDivider.setAttribute("y1", actionTop);
          actionDivider.setAttribute("y2", actionTop);
          buttonDivider.setAttribute("x1", node.width / 2);
          buttonDivider.setAttribute("x2", node.width / 2);
          buttonDivider.setAttribute("y1", actionTop);
          buttonDivider.setAttribute("y2", node.height - 1);
          for (const [button, left, width] of [
            [expandAction, 1, node.width / 2 - 1],
            [moveAction, node.width / 2, node.width / 2 - 1]
          ]) {
            button.rect.setAttribute("x", left);
            button.rect.setAttribute("y", actionTop + 1);
            button.rect.setAttribute("width", width);
            button.rect.setAttribute("height", nodeActionRowHeight - 2);
            button.text.setAttribute("x", left + width / 2);
            button.text.setAttribute("y", actionTop + 17);
          }
        };
        group.append(
          titleElement,
          descriptionLayer,
          actionDivider,
          buttonDivider,
          expandAction.control,
          moveAction.control
        );
        nodeLayer.append(group);
        updateNodeLayout();

        let drag = null;
        const applyDragPosition = () => {
          if (!drag) return;
          const deltaX = (drag.clientX - drag.lastX) * drag.scaleX;
          const deltaY = (drag.clientY - drag.lastY) * drag.scaleY;
          drag.lastX = drag.clientX;
          drag.lastY = drag.clientY;
          if (deltaX === 0 && deltaY === 0) return false;
          node.x += deltaX;
          node.y += deltaY;
          group.setAttribute("transform", `translate(${node.x} ${node.y})`);
          return true;
        };
        moveAction.control.addEventListener("pointerdown", event => {
          if (event.button !== 0) return;
          event.preventDefault();
          event.stopPropagation();
          const bounds = svg.getBoundingClientRect();
          drag = {
            pointerId: event.pointerId,
            clientX: event.clientX,
            clientY: event.clientY,
            lastX: event.clientX,
            lastY: event.clientY,
            scaleX: viewWidth / bounds.width,
            scaleY: viewHeight / bounds.height
          };
          group.classList.add("dragging");
          group.setPointerCapture(event.pointerId);
        });

        group.addEventListener("pointermove", event => {
          if (!drag || event.pointerId !== drag.pointerId) return;
          drag.clientX = event.clientX;
          drag.clientY = event.clientY;
          if (drag.frame === undefined) {
            drag.frame = requestAnimationFrame(() => {
              if (!drag) return;
              drag.frame = undefined;
              if (applyDragPosition()) {
                updateSvgViewport();
                queueRoutingMove(node);
              }
            });
          }
        });
        moveAction.control.addEventListener("keydown", event => {
          const movement = {
            ArrowUp: [0, -10],
            ArrowDown: [0, 10],
            ArrowLeft: [-10, 0],
            ArrowRight: [10, 0]
          }[event.key];
          if (!movement) return;
          event.preventDefault();
          node.x += movement[0];
          node.y += movement[1];
          group.setAttribute("transform", `translate(${node.x} ${node.y})`);
          updateSvgViewport();
          queueRoutingMove(node);
        });

        const finishDragging = event => {
          if (!drag || event.pointerId !== drag.pointerId) return;
          drag.clientX = event.clientX;
          drag.clientY = event.clientY;
          if (drag.frame !== undefined) {
            cancelAnimationFrame(drag.frame);
            drag.frame = undefined;
          }
          applyDragPosition();
          drag = null;
          group.classList.remove("dragging");
          if (group.hasPointerCapture(event.pointerId)) {
            group.releasePointerCapture(event.pointerId);
          }
          updateSvgViewport();
          queueRoutingMove(node);
        };
        group.addEventListener("pointerup", finishDragging);
        group.addEventListener("pointercancel", finishDragging);
        group.addEventListener("lostpointercapture", finishDragging);
      }
    };
    const restoreWorkspace = async () => {
      const restoreErrors = [];
      try {
        const savedFiles = await getWorkspaceItem("project-files");
        if (isStoredFileList(savedFiles)) {
          projectFiles = savedFiles;
          embeddedSources = Object.fromEntries(
            projectFiles.map(({path, contents}) => [path, contents])
          );
          updateUploadButton();
          uploadPickerStatus.textContent = `${projectFiles.length} saved project files restored from this browser.`;
        }
      } catch (error) {
        restoreErrors.push(`project files: ${error.message}`);
      }
      try {
        const savedGraph = await getWorkspaceItem("generated-graph");
        if (isStoredGeneratedGraph(savedGraph)) {
          graph = savedGraph.graph;
          generatedGraphSource = savedGraph.source;
        } else if (isStoredGraph(savedGraph)) {
          graph = savedGraph;
          const legacyDebug = await getWorkspaceItem("generated-debug");
          if (typeof legacyDebug?.graphSource === "string") {
            generatedGraphSource = legacyDebug.graphSource;
          }
        }
      } catch (error) {
        restoreErrors.push(`generated graph: ${error.message}`);
      }
      try {
        await renderGraph(graph);
      } catch (error) {
        restoreErrors.push(`graph layout: ${error.message}`);
        console.error("Graph layout failed:", error);
      }
      updateGraphExportButton();
      if (restoreErrors.length > 0) {
        console.error(`Could not restore ${restoreErrors.join("; ")}`);
      }
      workspaceReady = true;
      updateUploadButton();
      updateGenerateButtonState();
    };
    restoreWorkspace().catch(error => {
      workspaceReady = true;
      updateUploadButton();
      updateGenerateButtonState();
      console.error("Workspace restore failed:", error);
      renderGraph(graph).catch(layoutError => {
        console.error("Graph layout failed:", layoutError);
      });
    });
  </script>
</body>

</html>
