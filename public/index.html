<!doctype html>
<html lang="en" data-pattern="crosses" data-server-mode="{{SERVER_MODE}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeMap</title>
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.5 Inter, sans-serif;
      color: #fff;
      background: #101010;
      --page-bg: #101010;
      --grid-line: rgba(255, 255, 255, 0.06);
      --pattern-line: rgba(255, 255, 255, 0.16);
      --node-bg: #1a1a1a;
      --line-color: rgba(255, 255, 255, 0.7);
      --connection-color: #b8b8b8;
      --canvas-border: rgba(255, 255, 255, 0.25);
      --text-color: #fff;
      --muted-color: rgba(255, 255, 255, 0.65);
      --button-bg: #101010;
      --button-hover-bg: #1a1a1a;
      --code-keyword: #ff7b72;
      --code-string: #a5d6ff;
      --code-number: #79c0ff;
      --code-comment: #8b949e;
      --code-title: #d2a8ff;
      --code-literal: #79c0ff;
      --code-attribute: #79c0ff;
      --code-meta: #ffa657;
      --code-addition: #aff5b4;
      --code-deletion: #ffdcd7;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      color: #202833;
      background: #f4f6f8;
      --page-bg: #f4f6f8;
      --grid-line: rgba(32, 40, 51, 0.08);
      --pattern-line: rgba(32, 40, 51, 0.18);
      --node-bg: #fff;
      --line-color: #57606a;
      --connection-color: #626b75;
      --canvas-border: #d0d7de;
      --text-color: #202833;
      --muted-color: #57606a;
      --button-bg: #fff;
      --button-hover-bg: #f4f6f8;
      --code-keyword: #cf222e;
      --code-string: #0a3069;
      --code-number: #0550ae;
      --code-comment: #6e7781;
      --code-title: #8250df;
      --code-literal: #0550ae;
      --code-attribute: #0550ae;
      --code-meta: #953800;
      --code-addition: #116329;
      --code-deletion: #82071e;
    }

    body {
      margin: 0;
    }

    main {
      display: flex;
      align-items: stretch;
      gap: 24px;
      height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .page-header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 16px;
      width: min(280px, 28vw);
      min-width: 220px;
      flex-shrink: 0;
      height: 100%;
    }

    .resize-handle {
      position: relative;
      z-index: 1;
      flex: 0 0 8px;
      width: 8px;
      margin-inline: -16px;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
    }

    .resize-handle::after {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      border-radius: 2px;
      background: transparent;
      content: "";
    }

    .resize-handle:hover::after,
    .resize-handle:focus-visible::after {
      background: var(--line-color);
    }

    .resize-handle:focus {
      outline: none;
    }

    .node-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
      gap: 16px;
    }

    .node-panel-heading {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }

    .node-panel-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .node-panel-title {
      min-width: 0;
      overflow: visible;
      overflow-wrap: anywhere;
      text-overflow: clip;
      white-space: normal;
    }

    .node-panel-description {
      margin: 0;
      color: var(--muted-color);
      overflow-wrap: anywhere;
    }

    .node-panel-tabs {
      display: flex;
      flex: 0 0 auto;
      border-bottom: 1px solid var(--line-color);
    }

    .node-panel-tab {
      flex: 1 1 50%;
      padding: 8px;
      border: 0;
      border-bottom: 2px solid transparent;
      color: var(--muted-color);
      background: transparent;
      font: inherit;
      cursor: pointer;
    }

    .node-panel-tab[aria-selected="true"] {
      border-bottom-color: var(--line-color);
      color: var(--text-color);
    }

    .node-panel-content {
      overflow: auto;
      flex: 1 1 auto;
      min-height: 0;
      color: var(--muted-color);
    }

    .source-file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .source-file {
      min-width: 0;
      border-bottom: 1px solid var(--canvas-border);
    }

    .source-file summary {
      overflow-wrap: anywhere;
      padding: 8px 0;
      color: var(--text-color);
      cursor: pointer;
    }

    .source-file pre {
      overflow: auto;
      max-height: 50vh;
      margin: 0;
      padding: 0 0 10px 20px;
      color: var(--text-color);
      font: 12px/1.5 Consolas, "Courier New", monospace;
      white-space: pre;
      tab-size: 4;
    }

    .source-code-container {
      display: flex;
      max-height: 50vh;
      overflow: auto;
    }

    .source-code-container pre {
      flex: 0 0 auto;
      max-height: none;
      overflow: visible;
      margin: 0;
      padding-top: 0;
      padding-bottom: 10px;
      color: var(--text-color);
    }

    .source-code-container .source-line-numbers {
      position: sticky;
      left: 0;
      padding-right: 12px;
      border-right: 1px solid var(--canvas-border);
      background: var(--node-bg);
      color: var(--muted-color);
      text-align: right;
      user-select: none;
    }

    .source-code-container .source-code {
      min-width: max-content;
      padding-left: 12px;
    }

    .source-code code {
      font: inherit;
    }

    .source-code .hljs {
      color: var(--text-color);
      background: transparent;
    }

    .source-code .hljs-comment,
    .source-code .hljs-quote {
      color: var(--code-comment);
      font-style: italic;
    }

    .source-code .hljs-keyword,
    .source-code .hljs-selector-tag,
    .source-code .hljs-subst {
      color: var(--code-keyword);
    }

    .source-code .hljs-string,
    .source-code .hljs-doctag,
    .source-code .hljs-regexp {
      color: var(--code-string);
    }

    .source-code .hljs-number,
    .source-code .hljs-literal,
    .source-code .hljs-symbol,
    .source-code .hljs-bullet {
      color: var(--code-number);
    }

    .source-code .hljs-title,
    .source-code .hljs-section,
    .source-code .hljs-title.function_,
    .source-code .hljs-title.class_ {
      color: var(--code-title);
    }

    .source-code .hljs-attr,
    .source-code .hljs-attribute,
    .source-code .hljs-variable,
    .source-code .hljs-template-variable,
    .source-code .hljs-type,
    .source-code .hljs-built_in {
      color: var(--code-attribute);
    }

    .source-code .hljs-meta,
    .source-code .hljs-name,
    .source-code .hljs-params {
      color: var(--code-meta);
    }

    .source-code .hljs-addition {
      color: var(--code-addition);
    }

    .source-code .hljs-deletion {
      color: var(--code-deletion);
    }

    .source-file-status {
      padding: 0 10px 10px;
      color: var(--muted-color);
    }

    .node-summary-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .node-summary-controls .web-control {
      flex-direction: column;
    }

    #generate-summary-button {
      width: 100%;
    }

    .page-identity {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      gap: 12px;
    }

    .graph-details {
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .graph-details:has(h1:not(:empty), .graph-description:not(:empty)) {
      display: flex;
    }

    .brand-name {
      font-family: cursive;
      font-size: 34px;
      font-weight: 400;
      line-height: 1;
    }

    .page-controls {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      width: 100%;
      margin-top: auto;
      gap: 8px;
    }

    .web-control {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 12px;
    }

    #generate-button {
      width: 100%;
      border-color: var(--muted-color);
    }

    #upload-code-button {
      box-sizing: border-box;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .model-picker {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    #model-select {
      box-sizing: border-box;
      overflow: hidden;
      width: 100%;
      min-width: 0;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #model-select:disabled {
      text-align: center;
    }

    #model-select.web-mode-notice {
      text-align: center;
    }

    .model-menu {
      position: fixed;
      z-index: 2;
      top: 0;
      left: 0;
      width: min(420px, calc(100vw - 16px));
      display: flex;
      flex-direction: column-reverse;
      box-sizing: border-box;
      padding: 8px;
      border: 1px solid var(--line-color);
      border-radius: 12px;
      background: var(--page-bg);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .model-menu[hidden] {
      display: none;
    }

    .model-search {
      box-sizing: border-box;
      width: 100%;
      margin-top: 6px;
      flex: 0 0 auto;
      cursor: text;
    }

    .model-options {
      overflow-y: auto;
      max-height: 480px;
      min-height: 0;
      flex: 1 1 auto;
    }

    .model-group-label {
      padding: 6px 10px 3px;
      color: var(--muted-color);
      font-size: 12px;
      font-weight: 600;
    }

    .model-option {
      display: block;
      width: 100%;
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      color: var(--text-color);
      background: transparent;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .model-option:hover,
    .model-option[aria-selected="true"] {
      background: var(--button-hover-bg);
    }

    h1 {
      display: block;
      overflow: hidden;
      margin: 0;
      font-size: 20px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    h1:empty,
    .graph-description:empty {
      display: none;
    }

    .control-button {
      padding: 8px 12px;
      border: 2px solid var(--line-color);
      border-radius: 12px;
      color: var(--text-color);
      background: var(--button-bg);
      font: inherit;
      cursor: pointer;
    }

    .control-button:hover {
      background: var(--button-hover-bg);
    }

    .control-button:focus-visible {
      outline: 2px solid var(--line-color);
      outline-offset: 3px;
    }

    .graph-description {
      display: block;
      margin: 0;
      color: var(--muted-color);
    }

    .canvas {
      box-sizing: border-box;
      overflow: auto;
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      min-height: 0;
      height: 100%;
      border: 2px solid var(--line-color);
      border-radius: 12px;
      background-color: var(--page-bg);
    }

    :root[data-pattern="grid"] .canvas {
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 300px 200px;
    }

    :root[data-pattern="dots"] .canvas {
      background-image: radial-gradient(var(--pattern-line) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .canvas {
      cursor: grab;
      touch-action: none;
    }

    .canvas.panning {
      cursor: grabbing;
      user-select: none;
    }

    svg {
      display: block;
    }

    .edge {
      stroke: var(--connection-color);
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }

    .edge.dotted {
      stroke-dasharray: 5 5;
    }

    .edge-label {
      fill: var(--muted-color);
      font-size: 12px;
    }

    .node rect {
      fill: var(--node-bg);
      stroke: var(--line-color);
      stroke-width: 2;
    }

    .node {
      cursor: default;
      touch-action: none;
    }

    .node-action {
      cursor: default;
      touch-action: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .node-action rect {
      fill: transparent;
      stroke: none;
    }

    .node:hover .node-action {
      opacity: 1;
    }

    .node-action-divider {
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .node:hover .node-action-divider {
      opacity: 1;
    }

    .node-action:focus {
      outline: none;
    }

    .node-move:focus rect {
      stroke: var(--line-color);
    }

    .node-move {
      cursor: grab;
    }

    .node.dragging .node-move {
      cursor: grabbing;
    }

    .node-action text {
      fill: var(--text-color);
      font-size: 12px;
      pointer-events: none;
    }

    .node-title {
      fill: var(--text-color);
      font-size: 15px;
      font-weight: 650;
    }

    .node-description {
      fill: var(--muted-color);
      font-size: 12px;
    }

    .upload-dialog {
      width: min(480px, calc(100vw - 40px));
      box-sizing: border-box;
      padding: 0;
      border: 2px solid var(--line-color);
      border-radius: 12px;
      color: var(--text-color);
      background: var(--page-bg);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
    }

    .upload-dialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
    }

    .upload-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
    }

    .upload-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .upload-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }

    .upload-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .upload-field input {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 12px;
      border: 2px solid var(--line-color);
      border-radius: 12px;
      color: var(--text-color);
      background: var(--button-bg);
      font: inherit;
    }

    .upload-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upload-option {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .upload-option input {
      appearance: none;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 2px solid #fff;
      border-radius: 3px;
      background: transparent;
      display: grid;
      flex: 0 0 16px;
      place-content: center;
      cursor: pointer;
    }

    .upload-option input::before {
      width: 4px;
      height: 8px;
      border-right: 2px solid #fff;
      border-bottom: 2px solid #fff;
      content: "";
      opacity: 0;
      transform: translateY(-1px) rotate(45deg);
    }

    .upload-option input:checked::before {
      opacity: 1;
    }

    .upload-option input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .upload-dropzone {
      padding: 24px 16px;
      border: 2px dashed var(--line-color);
      border-radius: 12px;
      color: var(--muted-color);
      text-align: center;
    }

    .upload-dropzone.dragging {
      border-style: solid;
      color: var(--text-color);
      background: var(--button-hover-bg);
    }

    @media (max-width: 860px) {
      main {
        flex-direction: column;
      }

      .page-header {
        box-sizing: border-box;
        flex: 0 0 min(40vh, 360px);
        width: 100%;
        min-width: 0;
        height: auto;
      }

      .resize-handle {
        flex: 0 0 8px;
        width: auto;
        height: 8px;
        margin: -16px 0;
        cursor: row-resize;
      }

      .resize-handle::after {
        top: 3px;
        right: 0;
        bottom: auto;
        left: 0;
        width: auto;
        height: 2px;
      }

      .web-control {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="page-header">
      <div class="page-identity">
        <div class="brand-name">CodeMap</div>
        <div class="graph-details" id="graph-details">{{GRAPH_DETAILS}}</div>
      </div>
      <div class="page-controls">
        <div class="web-control">
          <span>API: <span id="api-status" aria-live="polite">Loading...</span></span>
          <button class="control-button" id="generation-settings-button" type="button"
            aria-haspopup="dialog" aria-controls="generation-settings-dialog">Generation Settings</button>
        </div>
        <div class="model-controls">
          <div class="model-picker" id="model-picker">
            <button class="control-button" id="model-select" type="button" disabled
              aria-haspopup="listbox" aria-expanded="false" aria-controls="model-options">Loading models...</button>
            <div class="model-menu" id="model-menu" hidden>
              <input class="control-button model-search" id="model-search" type="search"
                placeholder="Search models..." autocomplete="off" aria-label="Search models">
              <div class="model-options" id="model-options" role="listbox" aria-label="Models"></div>
            </div>
          </div>
        </div>
        <button class="control-button" id="upload-code-button" type="button">Upload code</button>
        <button class="control-button" id="generate-button" type="button">Generate</button>
      </div>
    </div>
    <div class="resize-handle" id="sidebar-resize-handle" role="separator" aria-orientation="vertical"
      aria-label="Resize sidebar" aria-valuemin="220" aria-valuenow="280" tabindex="0"></div>
    <div class="canvas"><svg id="graph-svg" role="img" aria-label="Codebase graph"></svg></div>
  </main>
  <dialog class="upload-dialog" id="upload-dialog" aria-labelledby="upload-dialog-title">
    <div class="upload-panel">
      <div class="upload-heading">
        <h2 id="upload-dialog-title">Upload code</h2>
        <button class="control-button" id="upload-close-button" type="button" aria-label="Close upload window">Close</button>
      </div>
      <div class="upload-options">
        <label class="upload-option" for="include-gitignored">
          <input id="include-gitignored" type="checkbox">
          Include .gitignore items
        </label>
        <label class="upload-option" for="include-non-text">
          <input id="include-non-text" type="checkbox">
          Include non text files
        </label>
        <label class="upload-option" for="ignore-big-files">
          <input id="ignore-big-files" type="checkbox">
          Ignore files too large to fit in a model chunk
        </label>
      </div>
      <label class="upload-field" for="upload-source">
        Folder path or repository URL
        <input id="upload-source" type="text" placeholder="Select a folder or enter a URL" autocomplete="off">
      </label>
      <div class="upload-dropzone" id="upload-dropzone" tabindex="0">
        Drop files or folders here
      </div>
      <button class="control-button" id="upload-browse-button" type="button">Choose folder</button>
      <span id="upload-picker-status" aria-live="polite"></span>
    </div>
  </dialog>
  <dialog class="upload-dialog" id="generation-settings-dialog" aria-labelledby="generation-settings-title">
    <div class="upload-panel">
      <div class="upload-heading">
        <h2 id="generation-settings-title">Generation Settings</h2>
        <button class="control-button" id="generation-settings-close-button" type="button"
          aria-label="Close generation settings">Close</button>
      </div>
      <button class="control-button" id="openrouter-sign-in-button" type="button">Auth via OpenRouter</button>
    </div>
  </dialog>
  <script type="application/json" id="graph-data">{{GRAPH_JSON}}</script>
  <script type="application/json" id="source-data">{{SOURCE_JSON}}</script>
  <pre hidden id="elk-license">{{ELK_LICENSE}}</pre>
  <pre hidden id="elkjs-libavoid-license">{{LIBAVOID_LICENSE}}</pre>
  <pre hidden id="libavoid-js-license">{{LIBAVOID_JS_LICENSE}}</pre>
  <pre hidden id="libavoid-wasm">{{LIBAVOID_WASM}}</pre>
  <script>{{ELK_JS}}</script>
  <script>{{LIBAVOID_JS}}</script>
  <script>{{HIGHLIGHT_JS}}</script>
  <script>
    const apiStatus = document.getElementById("api-status");
    const pageHeader = document.querySelector(".page-header");
    const defaultSidebarNodes = [...pageHeader.childNodes];
    const graphDetails = document.getElementById("graph-details");
    const modelSelect = document.getElementById("model-select");
    const modelSearch = document.getElementById("model-search");
    const modelPicker = document.getElementById("model-picker");
    const modelMenu = document.getElementById("model-menu");
    const modelOptions = document.getElementById("model-options");
    const authButton = document.getElementById("openrouter-sign-in-button");
    const generationSettingsButton = document.getElementById("generation-settings-button");
    const generationSettingsDialog = document.getElementById("generation-settings-dialog");
    const generationSettingsCloseButton = document.getElementById("generation-settings-close-button");
    const modelControls = document.querySelector(".model-controls");
    const modelControlsParent = modelControls.parentNode;
    const modelControlsNextSibling = modelControls.nextSibling;
    const uploadCodeButton = document.getElementById("upload-code-button");
    const uploadDialog = document.getElementById("upload-dialog");
    const uploadSource = document.getElementById("upload-source");
    const uploadDropzone = document.getElementById("upload-dropzone");
    const uploadBrowseButton = document.getElementById("upload-browse-button");
    const uploadCloseButton = document.getElementById("upload-close-button");
    const uploadPickerStatus = document.getElementById("upload-picker-status");
    const includeGitignored = document.getElementById("include-gitignored");
    const includeNonText = document.getElementById("include-non-text");
    const ignoreBigFiles = document.getElementById("ignore-big-files");
    const generateButton = document.getElementById("generate-button");
    let lastRenderedGenerationId = null;
    let activeGenerationId = null;
    let generationStarting = false;
    const generationFailureLabel = error =>
      /429|rate.?limit/i.test(error) ? "Generation failed: ratelimited" : "Generation failed";
    const sourceLanguageByExtension = {
      cjs: "javascript",
      bash: "bash",
      c: "c",
      cc: "cpp",
      clj: "clojure",
      cljc: "clojure",
      cljx: "clojure",

    const elk = new ELK();
    const libavoidWasmUrl = `data:application/wasm;base64,${
      document.getElementById("libavoid-wasm").textContent.trim()
    }`;
    let activeRoutingSession = null;

    const layoutGraphWithElk = async graph => {
      if (graph.nodes.length === 0) return;
      const nodeIds = new Set(graph.nodes.map(node => node.id));
      const elkEdges = graph.edges.map((edge, index) => {
        if (!nodeIds.has(edge.from) || !nodeIds.has(edge.to)) {
          throw new Error(`Graph edge references an unknown node: ${edge.from} -> ${edge.to}`);
        }
        const reversed = edge.arrow_start && !edge.arrow_end;
        return {
          id: `edge-${index}`,
          sources: [reversed ? edge.to : edge.from],
          targets: [reversed ? edge.from : edge.to]
        };
      });
      const layout = await elk.layout({
        id: "root",
        layoutOptions: {
          "elk.algorithm": "layered",
          "elk.direction": graph.direction === "LR" ? "RIGHT" : "DOWN",
          "elk.edgeRouting": "ORTHOGONAL",
          "elk.spacing.nodeNode": "72",
          "elk.layered.spacing.nodeNodeBetweenLayers": "80",
          "elk.padding": "[top=48,left=48,bottom=48,right=48]"
        },
        children: graph.nodes.map(node => ({
          id: node.id,
          width: node.width,
          height: node.height
        })),
        edges: elkEdges
      });
      const positions = new Map(layout.children.map(node => [node.id, node]));
      for (const node of graph.nodes) {
        const position = positions.get(node.id);
        if (!position || !Number.isFinite(position.x) || !Number.isFinite(position.y)) {
          throw new Error(`ELK did not place graph node '${node.id}'`);
        }
        node.x = position.x;
        node.y = position.y;
      }
      graph.width = layout.width;
      graph.height = layout.height;
    };

    let pollingInterval;
    const poll = async () => {
      try {
        const after = lastRenderedGenerationId === null
          ? ""
          : `?after=${lastRenderedGenerationId}`;
        const response = await fetch(`/api/poll${after}`, {cache: "no-store"});
        if (!response.ok) {
          throw new Error(`Polling request failed with status ${response.status}`);
        }
        const result = await response.json();
        if (generationStarting ||
          (activeGenerationId !== null && result.id < activeGenerationId)) return;
        if (result.status === "running") {
          generateButton.disabled = true;
          generateButton.textContent = "Generating...";
        } else if (result.status === "idle") {
          generateButton.disabled = false;
          generateButton.textContent = "Generate";
        } else if (result.status === "ready") {
          generateButton.disabled = false;
          if (result.graph && lastRenderedGenerationId !== result.id) {
            await renderGraph(result.graph);
            lastRenderedGenerationId = result.id;
            generateButton.textContent = "Generated";
            generateButton.title = "";
          }
        } else if (result.status === "failed") {
          generateButton.disabled = false;
          if (lastRenderedGenerationId !== result.id) {
            const message = result.error || "Graph generation failed.";
            generateButton.textContent = generationFailureLabel(message);
            generateButton.title = message;
            lastRenderedGenerationId = result.id;
          }
        }
      } catch (error) {
        window.clearInterval(pollingInterval);
        console.error("Polling stopped:", error);
      }
    };
    poll();
    pollingInterval = window.setInterval(poll, 3_000);

    const renderGraph = async graph => {
    const selfLoopRoute = node => {
      const clearance = 24;
      const centerX = node.x + node.width / 2;
      const centerY = node.y + node.height / 2;
      const outerX = node.x + node.width + clearance;
      const outerY = node.y - clearance;
      return [
        {x: node.x + node.width, y: centerY},
        {x: outerX, y: centerY},
        {x: outerX, y: outerY},
        {x: centerX, y: outerY},
        {x: centerX, y: node.y}
      ];
    };
    await layoutGraphWithElk(graph);
    const routingEdges = graph.edges.flatMap((edge, index) =>
      edge.from === edge.to
        ? []
        : [{id: `edge-${index}`, source: edge.from, target: edge.to}]
    );
    let nextRoutingSession = null;
    let latestRoutes = new Map();
    if (routingEdges.length > 0) {
      await ElkjsLibavoid.init(libavoidWasmUrl);
      nextRoutingSession = await ElkjsLibavoid.createRoutingSession({
        id: "root",
        children: graph.nodes.map(node => ({
          id: node.id,
          x: node.x,
          y: node.y,
          width: node.width,
          height: node.height
        })),
        edges: routingEdges
      }, {
        routingType: "orthogonal",
        shapeBufferDistance: 8
      });
      try {
        latestRoutes = nextRoutingSession.processTransaction();
      } catch (error) {
        nextRoutingSession.destroy();
        throw error;
      }
    }
    activeRoutingSession?.destroy();
    activeRoutingSession = nextRoutingSession;
    svg.replaceChildren();
    graphDetails.replaceChildren();
    if (graph.name) {
      const title = document.createElement("h1");
      title.textContent = graph.name;
      graphDetails.append(title);
    }
    if (graph.description) {
      const description = document.createElement("p");
      description.className = "graph-description";
      description.textContent = graph.description;
      graphDetails.append(description);
    }
    const initialGraphWidth = graph.width;
    const initialGraphHeight = graph.height;
    const viewportPadding = 48;
    let viewMinX = 0;
    let viewMinY = 0;
    let viewWidth = graph.width;
    let viewHeight = graph.height;
    let viewportInitialized = false;
    let crossBackground = null;

    const updateSvgViewport = () => {
      const previousMinX = viewMinX;
      const previousMinY = viewMinY;
      const minX = Math.min(0, ...graph.nodes.map(node => node.x - viewportPadding)) -
        canvas.clientWidth;
      const minY = Math.min(0, ...graph.nodes.map(node => node.y - viewportPadding)) -
        canvas.clientHeight;
      const maxX = Math.max(
        initialGraphWidth,
        ...graph.nodes.map(node => node.x + node.width + viewportPadding)
      ) + canvas.clientWidth;
      const maxY = Math.max(
        initialGraphHeight,
        ...graph.nodes.map(node => node.y + node.height + viewportPadding)
      ) + canvas.clientHeight;
      viewMinX = minX;
      viewMinY = minY;
      viewWidth = maxX - minX;
      viewHeight = maxY - minY;
      svg.setAttribute("width", viewWidth);
      svg.setAttribute("height", viewHeight);
      svg.setAttribute("viewBox", `${viewMinX} ${viewMinY} ${viewWidth} ${viewHeight}`);
      if (crossBackground) {
        crossBackground.setAttribute("x", viewMinX);
        crossBackground.setAttribute("y", viewMinY);
        crossBackground.setAttribute("width", viewWidth);
        crossBackground.setAttribute("height", viewHeight);
      }
      if (viewportInitialized) {
        canvas.scrollLeft += previousMinX - viewMinX;
        canvas.scrollTop += previousMinY - viewMinY;
      } else {
        viewportInitialized = true;
        canvas.scrollTo(canvas.clientWidth, canvas.clientHeight);
      }
    };

    if (resizeGraphViewport) {
      window.removeEventListener("resize", resizeGraphViewport);
    }
    resizeGraphViewport = updateSvgViewport;
    window.addEventListener("resize", resizeGraphViewport);
    updateSvgViewport();

    const definitions = makeSvgElement("defs");
    if (document.documentElement.dataset.pattern === "crosses") {
      const crossPattern = makeSvgElement("pattern", {
        id: "cross-pattern",
        width: "200",
        height: "200",
        patternUnits: "userSpaceOnUse"
      });
      crossPattern.append(makeSvgElement("path", {
        d: "M100 96.5v7M96.5 100h7",
        fill: "none",
        stroke: "var(--pattern-line)",
        "stroke-width": "1",
        "stroke-linecap": "round"
      }));
      definitions.append(crossPattern);
      svg.append(definitions);
      crossBackground = makeSvgElement("rect", {
        x: viewMinX,
        y: viewMinY,
        width: viewWidth,
        height: viewHeight,
        fill: "url(#cross-pattern)"
      });
      svg.append(crossBackground);
    } else {
      svg.append(definitions);
    }
    const arrow = makeSvgElement("marker", {
      id: "arrow",
      markerWidth: "8",
      markerHeight: "6",
      markerUnits: "userSpaceOnUse",
      viewBox: "0 0 8 6",
      refX: "7",
      refY: "3",
      orient: "auto-start-reverse"
    });
    arrow.append(makeSvgElement("path", {
      d: "M1,1 L6,3 L1,5",
      fill: "none",
      stroke: "var(--connection-color)",
      "stroke-width": "2",
      "stroke-linecap": "round",
      "stroke-linejoin": "round"
    }));
    definitions.append(arrow);
    const edgeLayer = makeSvgElement("g", {class: "edges"});
    const edgeLabelLayer = makeSvgElement("g", {class: "edge-labels"});
    const nodeLayer = makeSvgElement("g", {class: "nodes"});
    svg.append(edgeLayer, edgeLabelLayer, nodeLayer);

    const nodesById = new Map(graph.nodes.map(node => [node.id, node]));
    const computeRoutes = () => graph.edges.map((edge, index) => {
      const from = nodesById.get(edge.from);
      const to = nodesById.get(edge.to);
      if (!from || !to) {
        throw new Error(`Graph edge references an unknown node: ${edge.from} -> ${edge.to}`);
      }
      if (edge.from === edge.to) return selfLoopRoute(from);
      const route = latestRoutes.get(`edge-${index}`);
      if (!route) {
        throw new Error(`libavoid did not route graph edge: ${edge.from} -> ${edge.to}`);
      }
      return [route.sourcePoint, ...route.bendPoints, route.targetPoint];
    });

    const midpointOfSegmentAtRouteFraction = (points, fraction) => {
      const lengths = points.slice(1).map((point, index) =>
        Math.hypot(point.x - points[index].x, point.y - points[index].y)
      );
      const targetLength = lengths.reduce((total, length) => total + length, 0) * fraction;
      let traversed = 0;
      for (let index = 0; index < lengths.length; index++) {
        const length = lengths[index];
        if (length > 0 && traversed + length >= targetLength) {
          return {
            x: (points[index].x + points[index + 1].x) / 2,
            y: (points[index].y + points[index + 1].y) / 2,
            horizontal: points[index].y === points[index + 1].y,
            segmentIndex: index
          };
        }
        traversed += length;
      }
      return midpointOfSegment(points, Math.max(0, points.length - 2));
    };

    const midpointOfSegment = (points, index) => ({
      x: (points[index].x + points[index + 1].x) / 2,
      y: (points[index].y + points[index + 1].y) / 2,
      horizontal: points[index].y === points[index + 1].y,
      segmentIndex: index
    });

    const positionLabel = (labelText, position) => {
      labelText.setAttribute("x", position.x);
      labelText.setAttribute("y", position.horizontal ? position.y : position.y - 5);
      let textBounds = labelText.getBBox();
      if (position.horizontal) {
        const textCenterY = textBounds.y + textBounds.height / 2;
        labelText.setAttribute(
          "y",
          Number(labelText.getAttribute("y")) + position.y - textCenterY
        );
        textBounds = labelText.getBBox();
      }
      return {
        x: textBounds.x - 4,
        y: textBounds.y - 2,
        width: textBounds.width + 8,
        height: textBounds.height + 4
      };
    };

    const overlapArea = (first, second) => {
      const width = Math.max(
        0,
        Math.min(first.x + first.width, second.x + second.width) - Math.max(first.x, second.x)
      );
      const height = Math.max(
        0,
        Math.min(first.y + first.height, second.y + second.height) - Math.max(first.y, second.y)
      );
      return width * height;
    };

    const roundedRoutePath = (points, radius = 12) => {
      if (points.length < 3) {
        return points.map((point, index) =>
          `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`
        ).join(" ");
      }

      let path = `M ${points[0].x} ${points[0].y}`;
      for (let index = 1; index < points.length - 1; index++) {
        const previous = points[index - 1];
        const corner = points[index];
        const next = points[index + 1];
        const incomingLength = Math.hypot(corner.x - previous.x, corner.y - previous.y);
        const outgoingLength = Math.hypot(next.x - corner.x, next.y - corner.y);
        if (incomingLength === 0 || outgoingLength === 0) continue;

        const trim = Math.min(radius, incomingLength / 2, outgoingLength / 2);
        const before = {
          x: corner.x + (previous.x - corner.x) * (trim / incomingLength),
          y: corner.y + (previous.y - corner.y) * (trim / incomingLength)
        };
        const after = {
          x: corner.x + (next.x - corner.x) * (trim / outgoingLength),
          y: corner.y + (next.y - corner.y) * (trim / outgoingLength)
        };
        path += ` L ${before.x} ${before.y} Q ${corner.x} ${corner.y} ${after.x} ${after.y}`;
      }

      const last = points[points.length - 1];
      return `${path} L ${last.x} ${last.y}`;
    };

    const isInsideNode = (point, node) =>
      point.x >= node.x && point.x <= node.x + node.width &&
      point.y >= node.y && point.y <= node.y + node.height;

    const intersectNodeBoundary = (inside, outside, node) => {
      const dx = outside.x - inside.x;
      const dy = outside.y - inside.y;
      const tx = dx > 0
        ? (node.x + node.width - inside.x) / dx
        : dx < 0
          ? (node.x - inside.x) / dx
          : Infinity;
      const ty = dy > 0
        ? (node.y + node.height - inside.y) / dy
        : dy < 0
          ? (node.y - inside.y) / dy
          : Infinity;
      const t = Math.min(tx, ty);
      if (!Number.isFinite(t) || t < 0 || t > 1) {
        throw new Error("Could not find where an edge route exits a node");
      }
      return {x: inside.x + dx * t, y: inside.y + dy * t};
    };

    const clipRouteAtNode = (points, node) => {
      for (let index = 1; index < points.length; index++) {
        if (!isInsideNode(points[index], node)) {
          return [
            intersectNodeBoundary(points[index - 1], points[index], node),
            ...points.slice(index)
          ];
        }
      }
      return points;
    };

    const edgeElements = graph.edges.map(edge => {
      const path = makeSvgElement("path", {
        class: edge.dotted ? "edge dotted" : "edge"
      });
      if (edge.arrow_start) path.setAttribute("marker-start", "url(#arrow)");
      if (edge.arrow_end) path.setAttribute("marker-end", "url(#arrow)");
      edgeLayer.append(path);

      let label = null;
      let labelText = null;
      let labelBackground = null;
      if (edge.label) {
        label = makeSvgElement("g", {
          class: "edge-label",
          "pointer-events": "none"
        });
        labelBackground = makeSvgElement("rect", {
          fill: "var(--page-bg)",
          stroke: "#fff",
          "stroke-width": "1",
          rx: "4",
          ry: "4"
        });
        labelText = makeSvgElement("text", {"text-anchor": "middle"});
        labelText.textContent = edge.label;
        label.append(labelBackground, labelText);
        edgeLabelLayer.append(label);
      }
      return {path, label, labelText, labelBackground};
    });

    const dragRouteDelayFactor = 6;
    const hideEdgesDelayThreshold = 100;
    let nextDragRouteAt = 0;
    const scheduleDragRoute = drag => {
      if (drag.routeTimer !== null) return;
      const delay = Math.max(0, nextDragRouteAt - performance.now());
      drag.routeTimer = setTimeout(() => {
        drag.routeTimer = null;
        if (drag.active) updateEdgeRoutes({drag});
      }, delay);
    };
    const updateEdgeRoutes = ({drag = null, force = false, movedNode = null} = {}) => {
      if (drag && !force) {
        if (drag.clientX === drag.lastResolvedClientX &&
          drag.clientY === drag.lastResolvedClientY) {
          if (drag.routeTimer !== null) {
            clearTimeout(drag.routeTimer);
            drag.routeTimer = null;
          }
          edgeLayer.style.visibility = "visible";
          return false;
        }
        const remainingDelay = nextDragRouteAt - performance.now();
        if (remainingDelay > 0) {
          if (remainingDelay > hideEdgesDelayThreshold) {
            edgeLayer.style.visibility = "hidden";
          }
          scheduleDragRoute(drag);
          return false;
        }
      }
      if (drag && drag.routeTimer !== null) {
        clearTimeout(drag.routeTimer);
        drag.routeTimer = null;
      }

      const startedAt = performance.now();
      const nodeToMove = movedNode || (drag && nodesById.get(drag.nodeId));
      if (nodeToMove && activeRoutingSession) {
        activeRoutingSession.moveNode(nodeToMove.id, {x: nodeToMove.x, y: nodeToMove.y});
        latestRoutes = activeRoutingSession.processTransaction();
      }
      const routes = computeRoutes();
      const occupiedBounds = graph.nodes.map(node => ({
        x: node.x,
        y: node.y,
        width: node.width,
        height: node.height
      }));
      routes.forEach((points, index) => {
        const edge = graph.edges[index];
        const from = nodesById.get(edge.from);
        const to = nodesById.get(edge.to);
        let visiblePoints;
        if (edge.from === edge.to) {
          visiblePoints = selfLoopRoute(from);
        } else {
          const clippedPoints = clipRouteAtNode(points, from);
          visiblePoints = clipRouteAtNode(clippedPoints.slice().reverse(), to).reverse();
        }
        const {path, labelText, labelBackground} = edgeElements[index];
        path.setAttribute("d", roundedRoutePath(visiblePoints));
        if (labelText && labelBackground) {
          const labelFraction = edge.arrow_start !== edge.arrow_end ? 3 / 4 : 1 / 2;
          const initialPosition = midpointOfSegmentAtRouteFraction(visiblePoints, labelFraction);
          const segmentIndices = [
            initialPosition.segmentIndex,
            initialPosition.segmentIndex + 1,
            initialPosition.segmentIndex - 1
          ].filter(segmentIndex => {
            if (segmentIndex < 0 || segmentIndex >= visiblePoints.length - 1) return false;
            const start = visiblePoints[segmentIndex];
            const end = visiblePoints[segmentIndex + 1];
            return start.x !== end.x || start.y !== end.y;
          });
          let selectedPosition = null;
          let selectedBounds = null;
          let leastOverlap = Infinity;
          for (const [candidateIndex, segmentIndex] of segmentIndices.entries()) {
            const position = candidateIndex === 0
              ? initialPosition
              : midpointOfSegment(visiblePoints, segmentIndex);
            const bounds = positionLabel(labelText, position);
            const overlap = occupiedBounds.reduce(
              (total, previous) => total + overlapArea(bounds, previous),
              0
            );
            if (overlap < leastOverlap) {
              selectedPosition = position;
              selectedBounds = bounds;
              leastOverlap = overlap;
            }
            if (overlap === 0) break;
          }
          if (selectedPosition && selectedBounds) {
            positionLabel(labelText, selectedPosition);
            labelBackground.setAttribute("x", selectedBounds.x);
            labelBackground.setAttribute("y", selectedBounds.y);
            labelBackground.setAttribute("width", selectedBounds.width);
            labelBackground.setAttribute("height", selectedBounds.height);
            occupiedBounds.push(selectedBounds);
          }
        }
      });
      edgeLayer.style.visibility = "visible";
      const elapsed = performance.now() - startedAt;
      nextDragRouteAt = drag && !force
        ? performance.now() + elapsed * dragRouteDelayFactor
        : 0;
      if (drag) {
        drag.lastResolvedClientX = drag.clientX;
        drag.lastResolvedClientY = drag.clientY;
        if (!force) scheduleDragRoute(drag);
      }
      return true;
    };
    updateEdgeRoutes();

    resetGraphView = () => {
      canvas.scrollTo({
        left: -viewMinX,
        top: -viewMinY,
        behavior: "smooth"
      });
    };

    const wrapText = (text, maxChars, maxLines) => {
      const lines = [];
      let current = "";
      let truncated = false;
      for (const word of text.split(/\s+/).filter(Boolean)) {
        if (current && current.length + 1 + word.length > maxChars) {
          lines.push(current);
          if (lines.length === maxLines) {
            truncated = true;
            break;
          }
          current = "";
        }
        current += `${current ? " " : ""}${word}`;
      }
      if (current && lines.length < maxLines) lines.push(current);
      if (!lines.length) lines.push("");
      if (truncated) lines[lines.length - 1] += "...";
      return lines;
    };

    const nodeTitleRowHeight = 33;
    const nodeDescriptionLineHeight = 12;
    const nodeDescriptionLineCount = 6;
    const nodeActionRowHeight = 26;
    const nodeBaseHeight = nodeTitleRowHeight +
      nodeDescriptionLineHeight * nodeDescriptionLineCount +
      nodeActionRowHeight;

    for (const node of graph.nodes) {
      const group = makeSvgElement("g", {class: "node"});
      group.setAttribute("transform", `translate(${node.x} ${node.y})`);
      const background = makeSvgElement("rect", {
        x: 0,
        y: 0,
        width: node.width,
        height: node.height,
        rx: 12,
        ry: 12
      });
      group.append(background);
      const title = node.name || "";
      const description = node.description || "";
      const titleElement = makeSvgElement("text", {
        class: "node-title",
        x: node.width / 2,
        y: 0,
        "text-anchor": "middle"
      });
      const descriptionLayer = makeSvgElement("g");
      const actionDivider = makeSvgElement("line", {
        class: "node-action-divider",
        stroke: "var(--line-color)",
        "stroke-width": "1"
      });
      const buttonDivider = makeSvgElement("line", {
        class: "node-action-divider",
        stroke: "var(--line-color)",
        "stroke-width": "1"
      });
      const makeNodeAction = (className, label, action) => {
        const control = makeSvgElement("g", {
          class: `node-action ${className}`,
          role: "button",
          tabindex: "0",
          "aria-label": label
        });
        const rect = makeSvgElement("rect", {rx: "3", ry: "3"});
        const text = makeSvgElement("text", {
          "text-anchor": "middle"
        });
        text.textContent = className === "node-expand" ? "expand" : "move";
        control.append(rect, text);
        control.addEventListener("click", event => {
          event.stopPropagation();
          action();
        });
        control.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            event.stopPropagation();
            action();
          }
        });
        return {control, rect, text};
      };
      const expandAction = makeNodeAction(
        "node-expand",
        "Open node details",
        () => showNodePanel(node)
      );
      const moveAction = makeNodeAction("node-move", "Move node by dragging", () => {});

      const updateNodeLayout = () => {
        const descriptionLines = description
          ? wrapText(description, 24, nodeDescriptionLineCount)
          : [];
        node.height = nodeBaseHeight;
        background.setAttribute("height", node.height);
        titleElement.textContent = wrapText(title, 24, 1)[0];
        const titleBounds = titleElement.getBBox();
        titleElement.setAttribute(
          "y",
          nodeTitleRowHeight / 2 - (titleBounds.y + titleBounds.height / 2)
        );
        descriptionLayer.replaceChildren();
        const descriptionAreaHeight = node.height - nodeTitleRowHeight - nodeActionRowHeight;
        const descriptionTextHeight = descriptionLines.length * nodeDescriptionLineHeight;
        const descriptionFirstLineY = nodeTitleRowHeight +
          (descriptionAreaHeight - descriptionTextHeight) / 2 + 10;
        descriptionLines.forEach((line, index) => {
          const text = makeSvgElement("text", {
            class: "node-description",
            x: node.width / 2,
            y: descriptionFirstLineY + index * nodeDescriptionLineHeight,
            "text-anchor": "middle"
          });
          text.textContent = line;
          descriptionLayer.append(text);
        });

        const actionTop = node.height - nodeActionRowHeight;
        actionDivider.setAttribute("x1", "1");
        actionDivider.setAttribute("x2", node.width - 1);
        actionDivider.setAttribute("y1", actionTop);
        actionDivider.setAttribute("y2", actionTop);
        buttonDivider.setAttribute("x1", node.width / 2);
        buttonDivider.setAttribute("x2", node.width / 2);
        buttonDivider.setAttribute("y1", actionTop);
        buttonDivider.setAttribute("y2", node.height - 1);
        for (const [button, left, width] of [
          [expandAction, 1, node.width / 2 - 1],
          [moveAction, node.width / 2, node.width / 2 - 1]
        ]) {
          button.rect.setAttribute("x", left);
          button.rect.setAttribute("y", actionTop + 1);
          button.rect.setAttribute("width", width);
          button.rect.setAttribute("height", nodeActionRowHeight - 2);
          button.text.setAttribute("x", left + width / 2);
          button.text.setAttribute("y", actionTop + 17);
        }
      };
      group.append(
        titleElement,
        descriptionLayer,
        actionDivider,
        buttonDivider,
        expandAction.control,
        moveAction.control
      );
      nodeLayer.append(group);
      updateNodeLayout();

      let drag = null;
      moveAction.control.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        event.preventDefault();
        event.stopPropagation();
        const bounds = svg.getBoundingClientRect();
        drag = {
          pointerId: event.pointerId,
          nodeId: node.id,
          clientX: event.clientX,
          clientY: event.clientY,
          scaleX: viewWidth / bounds.width,
          scaleY: viewHeight / bounds.height,
          lastResolvedClientX: event.clientX,
          lastResolvedClientY: event.clientY,
          routeTimer: null,
          active: true
        };
        group.classList.add("dragging");
        group.setPointerCapture(event.pointerId);
      });

      group.addEventListener("pointermove", event => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        const deltaX = (event.clientX - drag.clientX) * drag.scaleX;
        const deltaY = (event.clientY - drag.clientY) * drag.scaleY;
        drag.clientX = event.clientX;
        drag.clientY = event.clientY;
        node.x += deltaX;
        node.y += deltaY;
        group.setAttribute("transform", `translate(${node.x} ${node.y})`);
        updateSvgViewport();
        updateEdgeRoutes({drag});
      });
      moveAction.control.addEventListener("keydown", event => {
        const movement = {
          ArrowUp: [0, -10],
          ArrowDown: [0, 10],
          ArrowLeft: [-10, 0],
          ArrowRight: [10, 0]
        }[event.key];
        if (!movement) return;
        event.preventDefault();
        node.x += movement[0];
        node.y += movement[1];
        group.setAttribute("transform", `translate(${node.x} ${node.y})`);
        updateSvgViewport();
        updateEdgeRoutes({force: true, movedNode: node});
      });

      const finishDragging = event => {
        if (!drag || event.pointerId !== drag.pointerId) return;
        drag.active = false;
        if (drag.routeTimer !== null) {
          clearTimeout(drag.routeTimer);
          drag.routeTimer = null;
        }
        drag = null;
        group.classList.remove("dragging");
        if (group.hasPointerCapture(event.pointerId)) {
          group.releasePointerCapture(event.pointerId);
        }
        updateEdgeRoutes({force: true, movedNode: node});
      };
      group.addEventListener("pointerup", finishDragging);
      group.addEventListener("pointercancel", finishDragging);
      group.addEventListener("lostpointercapture", finishDragging);
    }
    };
    renderGraph(graph).catch(error => {
      console.error("Graph layout failed:", error);
    });
  </script>
</body>

</html>
